# Pushes oci://ghcr.io/naira-project/charts/test-dependencies:<version> on tag v<version>.
name: Chart publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    name: Publish · test-dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - name: Tag matches chart version
        run: |
          VERSION=$(yq '.version' charts/test-dependencies/Chart.yaml)
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match chart version v${VERSION}"
            exit 1
          fi
      - name: Register chart repositories
        run: |
          helm repo add community-charts https://community-charts.github.io/helm-charts
          helm repo add open-metadata https://helm.open-metadata.org
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo add langfuse https://langfuse.github.io/langfuse-k8s
      - run: helm dependency build charts/test-dependencies
      - name: Package and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${GITHUB_TOKEN}" | helm registry login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          VERSION=$(yq '.version' charts/test-dependencies/Chart.yaml)
          # ghcr tags are mutable: never overwrite a published version. Only "not found" means unpublished.
          if out=$(helm show chart oci://ghcr.io/naira-project/charts/test-dependencies --version "${VERSION}" 2>&1); then
            echo "::error::test-dependencies ${VERSION} is already published; bump version in Chart.yaml"
            exit 1
          elif [[ "${out}" != *": not found"* ]]; then
            echo "::error::cannot tell whether test-dependencies ${VERSION} is published: ${out}"
            exit 1
          fi
          helm package charts/test-dependencies
          helm push test-dependencies-*.tgz oci://ghcr.io/naira-project/charts
