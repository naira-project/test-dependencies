apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Namespaces and RBAC only. The OpenBao and ESO charts are installed with Helm
# by `make platform-openbao-up` (values.yaml, eso/values.yaml).
resources:
  - namespace.yaml
  - rbac.yaml
  # unseal-keys-sealed.yaml is NOT listed here until a real encrypted form exists.
  # Add it after running platform-openbao-init and sealing the Secret.
  # See unseal-keys-sealed.yaml for instructions.
  - eso/
