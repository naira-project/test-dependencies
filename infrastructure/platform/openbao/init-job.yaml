# One-time initialization job — run by Platform Engineering via:
#   make platform-openbao-init
#
# Initializes OpenBao with a single unseal key (key-shares=1, threshold=1),
# then stores the unseal key and root token in the openbao-unseal-keys Secret.
# Safe to re-run: exits 0 with no changes if already initialized.
#
# Two-container design:
#   1. openbao init container — runs bao operator init, saves JSON to a shared volume
#   2. create-secret main container — reads the JSON, creates the K8s Secret via kubectl
#
# After this job completes, the Platform Engineer must:
#   1. Encrypt the openbao-unseal-keys Secret with SealedSecrets
#   2. Commit the encrypted form as unseal-keys-sealed.yaml
#   3. Restart the OpenBao pod so the unsealer sidecar picks up the key
# See README.md — Operator Runbook for detailed steps.
apiVersion: batch/v1
kind: Job
metadata:
  name: openbao-init
  namespace: naira-platform-openbao
  labels:
    app.kubernetes.io/name: openbao-init
    app.kubernetes.io/part-of: naira-platform
    app.kubernetes.io/component: openbao
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openbao-init
        app.kubernetes.io/part-of: naira-platform
    spec:
      restartPolicy: Never
      serviceAccountName: openbao-init

      initContainers:
        - name: bao-init
          image: openbao/openbao:2.5.3
          env:
            - name: BAO_ADDR
              value: "http://openbao-0.openbao-internal.naira-platform-openbao.svc.cluster.local:8200"
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu

              echo ">>> Waiting for OpenBao to be reachable..."
              until wget -q -O- http://127.0.0.1:8200/v1/sys/health 2>/dev/null || \
                    bao status 2>/dev/null || \
                    bao status 2>&1 | grep -qiE "sealed|initialized"; do
                sleep 3
              done
              echo ">>> OpenBao is reachable."

              INIT_STATUS=$(bao status -format=json 2>/dev/null \
                | grep '"initialized"' | grep -o 'true\|false' || echo "false")

              if [ "$INIT_STATUS" = "true" ]; then
                echo ">>> OpenBao already initialized — writing sentinel."
                echo "already_initialized" > /shared/status
                exit 0
              fi

              echo ">>> Initializing OpenBao (key-shares=1, key-threshold=1)..."
              bao operator init -key-shares=1 -key-threshold=1 -format=json \
                > /shared/init-output.json

              # awk handles multi-line pretty-printed JSON reliably
              awk '/"unseal_keys_b64"/{getline; gsub(/[^A-Za-z0-9+\/=]/, ""); print; exit}' \
                /shared/init-output.json > /shared/unseal_key
              awk -F'"' '/"root_token"/{print $4; exit}' \
                /shared/init-output.json > /shared/root_token
              echo "ok" > /shared/status

              echo ">>> Keys written to shared volume."
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 128Mi
          volumeMounts:
            - name: shared
              mountPath: /shared

      containers:
        - name: create-secret
          image: bitnami/kubectl:latest
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu

              STATUS=$(cat /shared/status 2>/dev/null || echo "")
              if [ "$STATUS" = "already_initialized" ]; then
                echo ">>> OpenBao already initialized — nothing to do."
                exit 0
              fi

              UNSEAL_KEY=$(cat /shared/unseal_key 2>/dev/null || echo "")
              ROOT_TOKEN=$(cat /shared/root_token 2>/dev/null || echo "")

              if [ -z "$UNSEAL_KEY" ] || [ -z "$ROOT_TOKEN" ]; then
                echo "ERROR: unseal_key or root_token missing in shared volume"
                ls -la /shared/ || true
                exit 1
              fi

              echo ">>> Creating openbao-unseal-keys Secret..."
              kubectl create secret generic openbao-unseal-keys \
                --from-literal=unseal_key="$UNSEAL_KEY" \
                --from-literal=root_token="$ROOT_TOKEN" \
                -n "$NAMESPACE" \
                --dry-run=client -o yaml | kubectl apply -f -

              echo ""
              echo "=========================================================="
              echo "  OpenBao initialized successfully."
              echo ""
              echo "  NEXT STEPS (Platform Engineer):"
              echo "  1. Encrypt the openbao-unseal-keys Secret:"
              echo "     SealedSecrets:"
              echo "       kubeseal --fetch-cert | kubeseal -o yaml \\"
              echo "         < <(kubectl get secret openbao-unseal-keys \\"
              echo "             -n naira-platform-openbao -o yaml) \\"
              echo "         > infrastructure/platform/openbao/unseal-keys-sealed.yaml"
              echo ""
              echo "  2. Add unseal-keys-sealed.yaml to kustomization.yaml, commit, and push."
              echo "  3. Restart pod (OnDelete strategy — must delete manually):"
              echo "       kubectl delete pod openbao-0 -n naira-platform-openbao"
              echo "  4. Run: make platform-openbao-seed"
              echo "=========================================================="
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 128Mi
          volumeMounts:
            - name: shared
              mountPath: /shared

      volumes:
        - name: shared
          emptyDir: {}
