injector:
  enabled: false

ui:
  enabled: true
  serviceType: ClusterIP

server:
  ha:
    enabled: true
    replicas: 1
    raft:
      enabled: true
      config: |
        ui = true

        listener "tcp" {
          address     = "[::]:8200"
          cluster_address = "[::]:8201"
          tls_disable = true
        }

        storage "raft" {
          path    = "/openbao/data"
          node_id = "openbao-0"
        }

        default_lease_ttl = "24h"
        max_lease_ttl     = "168h"

  dataStorage:
    enabled: true
    size: 1Gi

  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi

  # Sidecar that automatically unseals OpenBao on every pod start.
  # Reads the unseal key from the openbao-unseal-keys Secret created by the
  # platform-openbao-init job. Marked optional so the pod starts before init runs;
  # if no key is present yet the sidecar sleeps until the pod is restarted after init.
  extraContainers:
    - name: unsealer
      image: openbao/openbao:2.5.3
      env:
        - name: BAO_ADDR
          value: "http://127.0.0.1:8200"
        - name: UNSEAL_KEY
          valueFrom:
            secretKeyRef:
              name: openbao-unseal-keys
              key: unseal_key
              optional: true
      command: ["/bin/sh", "-c"]
      args:
        - |
          if [ -z "$UNSEAL_KEY" ]; then
            echo "unsealer: no unseal key configured — waiting for platform-openbao-init"
            sleep infinity
          fi
          echo "unsealer: waiting for OpenBao to start..."
          until bao status >/dev/null 2>&1 || bao status 2>&1 | grep -qE "Sealed|Initialized"; do
            sleep 2
          done
          echo "unsealer: OpenBao reachable, entering unseal loop"
          while true; do
            STATUS=$(bao status -format=json 2>/dev/null || echo '{"sealed":true}')
            if ! echo "$STATUS" | grep -Eq '"initialized"[[:space:]]*:[[:space:]]*true'; then
              echo "unsealer: OpenBao is not initialized yet; waiting for platform-openbao-init"
            elif echo "$STATUS" | grep -Eq '"sealed"[[:space:]]*:[[:space:]]*true'; then
              echo "unsealer: unsealing..."
              bao operator unseal "$UNSEAL_KEY" && echo "unsealer: unsealed." || true
            fi
            sleep 10
          done
      resources:
        requests:
          memory: 32Mi
          cpu: 10m
        limits:
          memory: 64Mi
