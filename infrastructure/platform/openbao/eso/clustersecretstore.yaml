# Cluster-wide SecretStore backed by the OpenBao platform component.
# Any namespace can reference this store in ExternalSecret resources.
# Authentication uses the Kubernetes auth method: ESO presents its own
# ServiceAccount token; OpenBao verifies it via the cluster's TokenReview API.
#
# Sync wave 1: Argo CD applies it after the ESO chart (CRDs + webhook) is healthy.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: openbao-platform
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    vault:
      server: "http://openbao.naira-platform-openbao.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "eso"
          serviceAccountRef:
            name: "external-secrets"
            namespace: "external-secrets"
