apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vcluster-instances
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/naira-project/test-dependencies.git
    targetRevision: spike/vcluster-gitops
    path: infrastructure/testbed/vcluster/instances
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m
