apiVersion: management.loft.sh/v1
kind: VirtualClusterInstance
metadata:
  name: dev-ephemeral
  namespace: p-team-alpha
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  clusterRef:
    cluster: loft-cluster
  owner:
    user: admin
  template:
    helmRelease:
      chart:
        version: 0.37.1
      values: |
        controlPlane:
          backingStore:
            etcd:
              deploy:
                enabled: true
                statefulSet:
                  scheduling:
                    nodeSelector:
                      karpenter.sh/nodepool: ephemeral
                    tolerations:
                      - key: lifecycle
                        value: ephemeral
                        effect: NoSchedule
          statefulSet:
            scheduling:
              nodeSelector:
                karpenter.sh/nodepool: ephemeral
              tolerations:
                - key: lifecycle
                  value: ephemeral
                  effect: NoSchedule
          coredns:
            deployment:
              nodeSelector:
                karpenter.sh/nodepool: ephemeral
              tolerations:
                - key: lifecycle
                  value: ephemeral
                  effect: NoSchedule
        sync:
          toHost:
            pods:
              enforceTolerations:
                - lifecycle=ephemeral:NoSchedule
          fromHost:
            nodes:
              enabled: true
              selector:
                labels:
                  karpenter.sh/nodepool: ephemeral
        integrations:
          argoCD:
            enabled: true
            connector: argocd
