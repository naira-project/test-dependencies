apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: litellm-mistral-api-key
  labels:
    app.kubernetes.io/name: litellm
    app.kubernetes.io/part-of: naira-testbed
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-platform
  target:
    name: litellm-mistral-api-key
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: MISTRAL_API_KEY
      remoteRef:
        key: testbed/litellm/mistral
        property: api_key
