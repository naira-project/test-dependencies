apiVersion: batch/v1
kind: Job
metadata:
  name: litellm-smoke-test
  labels:
    app.kubernetes.io/name: litellm
    app.kubernetes.io/part-of: naira-testbed
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: litellm-smoke-test
        app.kubernetes.io/part-of: naira-testbed
    spec:
      restartPolicy: Never
      containers:
        - name: smoke-test
          image: curlimages/curl:8.11.1
          env:
            - name: PROXY_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-masterkey
                  key: masterkey
          command:
            - /bin/sh
            - -ec
          args:
            - |
              base_url="http://litellm:4000"

              for i in $(seq 1 30); do
                if curl -fsS "${base_url}/health/readiness" >/dev/null; then
                  break
                fi
                if [ "$i" -eq 30 ]; then
                  echo "LiteLLM readiness check failed"
                  exit 1
                fi
                sleep 2
              done

              curl -fsS \
                -H "Authorization: Bearer ${PROXY_MASTER_KEY}" \
                "${base_url}/v1/models" \
                | grep -q '"chat-small"'

              curl -fsS \
                -H "Authorization: Bearer ${PROXY_MASTER_KEY}" \
                -H 'Content-Type: application/json' \
                -X POST "${base_url}/v1/chat/completions" \
                -d '{"model":"chat-small","messages":[{"role":"user","content":"ping"}]}' \
                | grep -q '"choices"'

              curl -fsS \
                -H "Authorization: Bearer ${PROXY_MASTER_KEY}" \
                -H 'Content-Type: application/json' \
                -X POST "${base_url}/v1/embeddings" \
                -d '{"model":"text-embeddings","input":"test"}' \
                | grep -q '"embedding"'
