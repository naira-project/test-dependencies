apiVersion: v2
name: test-dependencies
description: Third-party components Naira talks to but does not ship (RFC-009 §1)
type: application
# Versioned independently of Naira (RFC-009 §1).
version: 0.1.0
appVersion: "0.1.0"

# Tags, not conditions: a condition's `enabled` key fails strict subchart schemas (mlflow).
dependencies:
  # No PostgreSQL: LiteLLM uses its own database on Naira's server (litellm.db.*).
  - name: litellm-helm
    alias: litellm
    version: "1.84.0"
    repository: oci://docker.litellm.ai/berriai
    tags: [litellm]
  - name: mlflow
    version: "1.11.7"
    repository: https://community-charts.github.io/helm-charts
    tags: [mlflow]
  # Langfuse brings PostgreSQL, Valkey and SeaweedFS as subcharts. Its
  # ClickHouse is switched off and templates/clickhouse.yaml renders one
  # instead: chart 2.x builds it from ClickHouseCluster and KeeperCluster CRs,
  # which would make the ClickHouse operator and cert-manager prerequisites of
  # this chart. Off by default for its size; see values.yaml.
  - name: langfuse
    version: "2.1.5"
    repository: https://langfuse.github.io/langfuse-k8s
    tags: [langfuse]
  # OpenMetadata: dependencies (OpenSearch; MySQL off) and server, one tag.
  - name: openmetadata-dependencies
    version: "2.0.1"
    repository: https://helm.open-metadata.org
    tags: [openmetadata]
  - name: openmetadata
    version: "2.0.1"
    repository: https://helm.open-metadata.org
    tags: [openmetadata]
  - name: kube-prometheus-stack
    version: "91.2.0"
    repository: https://prometheus-community.github.io/helm-charts
    tags: [monitoring]
  # Logging: Alloy tails pod logs and pushes them to Loki; Grafana (from
  # kube-prometheus-stack) queries Loki. Same tag as the metrics stack, so one
  # switch brings up all of observability.
  - name: loki
    version: "7.3.0"
    repository: https://grafana.github.io/helm-charts
    tags: [monitoring]
  - name: alloy
    version: "1.13.0"
    repository: https://grafana.github.io/helm-charts
    tags: [monitoring]
  # CloudWatch metrics (Bedrock) into Prometheus. Own tag rather than
  # `monitoring`: it needs AWS credentials and every scrape is billed by AWS.
  # Also needs tags.monitoring (ServiceMonitor CRD); templates/validate.yaml checks.
  - name: yet-another-cloudwatch-exporter
    alias: yace
    version: "0.39.1"
    repository: https://prometheus-community.github.io/helm-charts
    tags: [yace]
