apiVersion: v2
name: test-dependencies
description: Third-party components Naira talks to but does not ship (RFC-009 §1)
type: application
# Versioned independently of Naira: these move on upstream upgrade cycles that
# have nothing to do with a Naira release (RFC-009 §1).
version: 0.1.0
appVersion: "0.1.0"

# Gating uses Helm `tags`, not `condition: <name>.enabled`.
#
# `condition` injects an `enabled` key into the subchart's own values, and any
# upstream chart shipping a strict values.schema.json rejects it — mlflow 1.11.7
# does exactly that. Tags live in the parent and are never passed down.
#
# It also buys something: one `monitoring` tag gates both kube-prometheus-stack
# and the ServiceMonitors in templates/. The CRs cannot be applied without the
# operator that defines them, structurally, rather than by a validation rule.
dependencies:
  # PostgreSQL comes from litellm's own subchart (litellm.postgresql.*) rather
  # than a second standalone instance — one database, one lifecycle.
  - name: litellm-helm
    alias: litellm
    version: "1.82.3"
    repository: oci://docker.litellm.ai/berriai
    tags: [litellm]
  - name: mlflow
    version: "1.11.7"
    repository: https://community-charts.github.io/helm-charts
    tags: [mlflow]
  # OpenMetadata is two upstream charts on one tag: the dependencies chart
  # (MySQL, OpenSearch; Airflow disabled in values.yaml) and the server. Off by
  # default — it is heavy for a single kind node alongside the rest.
  - name: openmetadata-dependencies
    version: "2.0.1"
    repository: https://helm.open-metadata.org
    tags: [openmetadata]
  - name: openmetadata
    version: "2.0.1"
    repository: https://helm.open-metadata.org
    tags: [openmetadata]
  - name: kube-prometheus-stack
    version: "91.2.0"
    repository: https://prometheus-community.github.io/helm-charts
    tags: [monitoring]
  # Logging: Alloy tails pod logs and pushes them to Loki; Grafana (from
  # kube-prometheus-stack) queries Loki. Same tag as the metrics stack, so one
  # switch brings up all of observability.
  - name: loki
    version: "7.3.0"
    repository: https://grafana.github.io/helm-charts
    tags: [monitoring]
  - name: alloy
    version: "1.13.0"
    repository: https://grafana.github.io/helm-charts
    tags: [monitoring]
  # CloudWatch metrics (Bedrock) into Prometheus. Own tag rather than
  # `monitoring`: it needs AWS credentials and every scrape is billed by AWS.
  # Also needs tags.monitoring (ServiceMonitor CRD); templates/validate.yaml checks.
  - name: yet-another-cloudwatch-exporter
    alias: yace
    version: "0.39.1"
    repository: https://prometheus-community.github.io/helm-charts
    tags: [yace]
