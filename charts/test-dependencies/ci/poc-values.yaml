# Render and lint fixture: the values of the RFC-009 PoC's Argo CD
# Application, an install with the Secrets created from values and mcp-mock
# from a separate registry. chart-testing lints the chart with every
# ci/*-values.yaml; tests/render-test.sh renders this file too. Real
# environments are Argo CD Applications in naira-project/test-infrastructure
# (gitops/apps/<env>/). All credentials here are placeholders.
tags:
  keycloak: true
  litellm: true
  mlflow: true
  mcpMock: true
  openmetadata: false
  monitoring: false
  llamacpp: false
  vllm: false
keycloak:
  admin:
    create: true
    username: admin
    password: admin
mcpMock:
  image:
    registry: naira-poc-registry:5000
    repository: naira-mcp-mock
    tag: 0.1.0-poc
litellm:
  postgresql:
    auth:
      # Required by the chart; the litellm-helm sample value is rejected.
      password: litellm-poc-postgres
      postgres-password: litellm-poc-postgres
secrets:
  litellmMasterkey:
    create: true
    value: sk-local-litellm  # equals the catalog's LITELLM_API_KEY in README step 4
  litellmProviderKeys:
    create: true
    data:
      MISTRAL_API_KEY: change-me
mlflow:
  # Pinned so renders are deterministic; otherwise selfHeal fights a key that
  # changes on every render.
  flaskServerSecretKey: poc-flask-key
