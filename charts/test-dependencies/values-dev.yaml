# Local kind. Tilt installs this chart with this file.
#
# On here is what fits on one kind node alongside the Naira chart: Keycloak,
# LiteLLM + its PostgreSQL, MLflow, llama.cpp (two small models, downloaded on
# first start) and mcp-mock.

tags:
  keycloak: true
  litellm: true
  mlflow: true
  mcpMock: true
  openmetadata: false
  monitoring: false
  llamacpp: true
  vllm: false
  yace: false

keycloak:
  admin:
    create: true
    username: admin
    password: admin

secrets:
  litellmMasterkey:
    create: true
    value: sk-local-litellm
  litellmProviderKeys:
    create: true
    data:
      # Fake is fine: LiteLLM lists models without calling the provider.
      MISTRAL_API_KEY: change-me
  # tags.openmetadata stays off (heavy); this and the block below are wired so
  # `--set tags.openmetadata=true` brings it up without further values.
  openmetadataMysql:
    create: true   # password: chart default, equals the init script's literal

litellm:
  postgresql:
    auth:
      password: litellm-local-postgres
      postgres-password: litellm-local-postgres

mlflow:
  # Pinned so renders are deterministic; upstream otherwise generates a new
  # key on every render.
  flaskServerSecretKey: local-dev-flask-key

openmetadata-dependencies:
  mysql:
    primary:
      persistence:
        size: 2Gi
  opensearch:
    persistence:
      size: 2Gi

# observability stack components' extra dev values, bound to the issue #14

# ── yet-another-cloudwatch-exporter (YACE) values for local kind dev environment ──
# Pulls metrics from AWS CloudWatch and exposes them on /metrics so the
# in-cluster Prometheus (kube-prometheus-stack) scrapes them like any other
# target. Perses then queries them through the existing Prometheus datasource.
#
# AWS credentials are NOT set here. Off by default (tags.yace). To enable:
#   helm upgrade --install ... --set tags.monitoring=true --set tags.yace=true \
#     --set secrets.yaceAws.create=true \
#     --set secrets.yaceAws.accessKey=$AWS_ACCESS_KEY_ID \
#     --set secrets.yaceAws.secretKey=$AWS_SECRET_ACCESS_KEY
# The chart then creates the `yace-aws-credentials` Secret that aws.secret.name
# points at.

yace:
  aws:
    secret:
      name: yace-aws-credentials

  extraArgs:
    # How often YACE queries CloudWatch (seconds). Prometheus scrapes the cached
    # result in between, so this — not the ServiceMonitor interval — drives cost.
    scraping-interval: 300

  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

  # Picked up by Prometheus because prometheus-values.yaml sets
  # serviceMonitorSelectorNilUsesHelmValues: false.
  serviceMonitor:
    enabled: true
    interval: 60s
    timeout: 30s

  # The chart's connection test pod is not needed in dev.
  testConnection: false

  # YACE job config: https://github.com/prometheus-community/yet-another-cloudwatch-exporter/blob/master/docs/configuration.md
  # Metric names follow aws_<namespace>_<metric>_<statistic> in snake_case,
  # e.g. AWS/Bedrock InputTokenCount Sum → aws_bedrock_input_token_count_sum.
  config: |-
    apiVersion: v1alpha1
    # Bedrock invocation metrics are dimensioned by ModelId and have no taggable
    # resources, so they go under customNamespace instead of discovery.
    customNamespace:
      - name: bedrock
        namespace: AWS/Bedrock
        # Keep in sync with the Bedrock plugin's REGIONS (core/infra/kubernetes/catalog.yaml),
        # since the UI's per-endpoint panels filter on region.
        regions:
          - us-east-1
          - eu-central-1
        period: 300
        length: 600
        # Report 0 instead of dropping the series when a model had no traffic in
        # the last period, so per-endpoint charts show idle time rather than gaps.
        nilToZero: true
        metrics:
          - name: Invocations
            statistics: [Sum]
          - name: InvocationLatency
            statistics: [Average]
          - name: InputTokenCount
            statistics: [Sum]
          - name: OutputTokenCount
            statistics: [Sum]

alloy:
  # ── Grafana Alloy values for local kind dev environment ───────────────────────
  # Tails container logs through the Kubernetes API and pushes them to Loki
  # (loki-values.yaml). Reading via the API instead of /var/log on each node lets
  # a single Deployment cover the whole cluster, which is enough for kind.
  #
  # Every stream is labelled with namespace, pod, container and app (the pod's
  # `app` label).

  controller:
    type: deployment
    replicas: 1

  alloy:
    # UI/clustering are not needed for a single replica.
    clustering:
      enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
    configMap:
      content: |-
        discovery.kubernetes "pods" {
          role = "pod"
        }

        discovery.relabel "pods" {
          targets = discovery.kubernetes.pods.targets

          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            target_label  = "namespace"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_name"]
            target_label  = "pod"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_container_name"]
            target_label  = "container"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_label_app"]
            target_label  = "app"
          }
        }

        loki.source.kubernetes "pods" {
          targets    = discovery.relabel.pods.output
          forward_to = [loki.write.default.receiver]
        }

        loki.write "default" {
          endpoint {
            url = "http://loki:3100/loki/api/v1/push"
          }
        }



# Loki: single-binary on the local filesystem: one pod, no object storage, no
# caches. Alloy pushes pod logs here, and the Grafana that ships with
# kube-prometheus-stack queries it through the "loki" datasource.
# Nested under the subchart's name, hence `loki.loki` below.
loki:
  # Fixed Service name: Alloy and Grafana reach Loki as http://loki:3100
  # whatever the release name or namespace is.
  fullnameOverride: loki
  deploymentMode: SingleBinary

  loki:
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    storage:
      type: filesystem
    schemaConfig:
      configs:
        - from: "2024-04-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: loki_index_
            period: 24h
    # Retention is enforced by the compactor, so it must be enabled for
    # retention_period to delete anything.
    compactor:
      retention_enabled: true
      delete_request_store: filesystem
    limits_config:
      retention_period: 72h

  singleBinary:
    replicas: 1
    persistence:
      enabled: true
      size: 5Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

  # The scalable targets are unused in SingleBinary mode.
  backend:
    replicas: 0
  read:
    replicas: 0
  write:
    replicas: 0

  # Not needed for a single dev tenant: Grafana and Alloy use the loki Service directly.
  gateway:
    enabled: false
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false
  lokiCanary:
    enabled: false
  test:
    enabled: false


kube-prometheus-stack:
  # ── kube-prometheus-stack values for local kind dev environment ───────────────
  # Provides: Prometheus Operator, Prometheus, Grafana, kube-state-metrics, node-exporter
  # Disabled: Alertmanager, Thanos, Windows Exporter, Prometheus Adapter

  # ── Prometheus ──────────────────────────────────────────────────────────────────
  prometheus:
    prometheusSpec:
      # Discover ALL ServiceMonitors, not just those with Helm release labels.
      # This lets us add custom ServiceMonitors (e.g. for vLLM) without Helm labels.
      serviceMonitorSelectorNilUsesHelmValues: false

      # How long to keep raw metric data before discarding it.
      retention: 7d

      resources:
        requests:
          cpu: 200m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 1Gi

      # Persistent volume for metric storage — avoids data loss on pod restart.
      storageSpec:
        volumeClaimTemplate:
          spec:
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 10Gi

    # Prometheus UI reachable only via kubectl port-forward.
    ingress:
      enabled: false

    service:
      type: ClusterIP


  # ── Grafana ─────────────────────────────────────────────────────────────────────
  # Pre-configured with admin/admin login.
  # The chart auto-provisions a datasource pointing to the in-cluster Prometheus.
  grafana:
    enabled: true
    adminPassword: admin
    # Loki is deployed by `task llm-inference:logging:deploy` (loki-values.yaml).
    additionalDataSources:
      - name: Loki
        type: loki
        uid: loki
        access: proxy
        url: http://loki:3100
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 768Mi
    ingress:
      enabled: false
    service:
      type: ClusterIP

  # ── kube-state-metrics ──────────────────────────────────────────────────────────
  # Translates Kubernetes API objects state into metrics: deployments, pods, nodes, 
  # services, namespaces, etc. Powers dashboards showing "how many pods are running"
  # or "what's the deployment status"
  kubeStateMetrics:
    enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 100m
        memory: 256Mi

  # ── node-exporter ───────────────────────────────────────────────────────────────
  # Runs on every node and exposes hardware / OS metrics: CPU usage, memory,
  # disk I/O, network traffic, load averages. Gives a node-level view of
  # resource utilisation.
  nodeExporter:
    enabled: true
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        cpu: 50m
        memory: 64Mi

  # ── Prometheus Operator ─────────────────────────────────────────────────────────
  # Watches ServiceMonitor CRDs and translate them into Prometheus configuration.
  prometheusOperator:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

  # ── Disabled ────────────────────────────────────────────────

  # Handles alerts fired by Prometheus (e.g. routing to email/Slack/etc.).
  alertmanager:
    enabled: false

  # Would be needed if we wanted to autoscale deployments based on Prometheus metrics
  prometheusAdapter:
    enabled: false

  # Long-term, cross-cluster metrics storage and querying.
  thanos:
    enabled: false

  # Windows node-exporter
  windows:
    enabled: false