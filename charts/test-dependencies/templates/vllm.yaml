{{/*
vLLM (CPU). One model, served over the OpenAI-compatible API on 8000. The chat
template is mounted because small base models ship without one. Mutually
exclusive with llama.cpp (validate.yaml).

Startup (importing torch, downloading the model, initializing the engine) took
about four minutes on a sandbox node, so a startup probe gates the others. The
Hugging Face cache is an emptyDir: a container restart reuses the download.
*/}}
{{- if .Values.tags.vllm }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: vllm-chat-template
  namespace: {{ .Release.Namespace }}
  labels: {{- include "deps.labels" . | nindent 4 }}
data:
  chat-template.jinja: |
    {% for message in messages %}
    {% if message['role'] == 'system' %}System: {{ "{{" }} message['content'] {{ "}}" }}
    {% elif message['role'] == 'user' %}User: {{ "{{" }} message['content'] {{ "}}" }}
    {% elif message['role'] == 'assistant' %}Assistant: {{ "{{" }} message['content'] {{ "}}" }}
    {% endif %}
    {% endfor %}
    Assistant:
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: {{ .Release.Namespace }}
  labels: {{- include "deps.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {app: vllm}
  template:
    metadata:
      labels:
        app: vllm
        {{- include "deps.labels" . | nindent 8 }}
    spec:
      enableServiceLinks: false
      volumes:
        - name: chat-template
          configMap: {name: vllm-chat-template}
        - name: dshm
          emptyDir: {medium: Memory, sizeLimit: 1Gi}
        - name: hf-cache
          emptyDir: {}
      containers:
        - name: vllm
          image: {{ .Values.vllm.image | quote }}
          args:
            - {{ .Values.vllm.model | quote }}
            - --served-model-name
            - {{ .Values.vllm.servedModelName | quote }}
            - --chat-template
            - /etc/vllm/chat-template.jinja
          env:
            - {name: VLLM_CPU_KVCACHE_SPACE, value: {{ .Values.vllm.kvCacheSpace | quote }}}
          ports:
            - {containerPort: 8000, name: http}
          volumeMounts:
            - {name: chat-template, mountPath: /etc/vllm/chat-template.jinja, subPath: chat-template.jinja, readOnly: true}
            - {name: dshm, mountPath: /dev/shm}
            # The image runs as root; vLLM caches models under $HOME.
            - {name: hf-cache, mountPath: /root/.cache/huggingface}
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60   # 10 minutes
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 30
            timeoutSeconds: 10
          resources: {{- toYaml .Values.vllm.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: vllm
  namespace: {{ .Release.Namespace }}
  labels:
    app: vllm
    app.kubernetes.io/component: inference
    {{- include "deps.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {app: vllm}
  ports:
    - {name: http, port: 8000, targetPort: http}
{{- end }}
