{{- if .Values.tags.litellm }}
{{- with .Values.secrets.litellmMasterkey }}
{{- if .create }}
apiVersion: v1
kind: Secret
metadata:
  name: litellm-masterkey
  namespace: {{ $.Release.Namespace }}
  labels: {{- include "deps.labels" $ | nindent 4 }}
  annotations:
    naira.io/warning: "Generated from chart values. Development only."
type: Opaque
stringData:
  masterkey: {{ required "secrets.litellmMasterkey.value is required when create=true" .value | quote }}
---
{{- end }}
{{- end }}
{{- with .Values.secrets.litellmProviderKeys }}
{{- if .create }}
apiVersion: v1
kind: Secret
metadata:
  name: litellm-provider-keys
  namespace: {{ $.Release.Namespace }}
  labels: {{- include "deps.labels" $ | nindent 4 }}
  annotations:
    naira.io/warning: "Generated from chart values. Development only."
type: Opaque
stringData:
  {{- range $k, $v := .data }}
  {{ $k }}: {{ $v | toString | quote }}
  {{- end }}
---
{{- end }}
{{- end }}
{{- with .Values.secrets.litellmDatabase }}
{{- if .create }}
apiVersion: v1
kind: Secret
metadata:
  name: litellm-db
  namespace: {{ $.Release.Namespace }}
  labels: {{- include "deps.labels" $ | nindent 4 }}
  annotations:
    naira.io/warning: "Generated from chart values. Development only."
type: Opaque
stringData:
  username: {{ .username | quote }}
  password: {{ required "secrets.litellmDatabase.password is required when create=true" .password | quote }}
{{- end }}
{{- end }}
{{- end }}
{{- if .Values.tags.yace }}
{{- with .Values.secrets.yaceAws }}
{{- if .create }}
---
apiVersion: v1
kind: Secret
metadata:
  name: yace-aws-credentials
  namespace: {{ $.Release.Namespace }}
  labels: {{- include "deps.labels" $ | nindent 4 }}
  annotations:
    naira.io/warning: "Generated from chart values. Development only."
type: Opaque
stringData:
  access_key: {{ required "secrets.yaceAws.accessKey is required when create=true" .accessKey | quote }}
  secret_key: {{ required "secrets.yaceAws.secretKey is required when create=true" .secretKey | quote }}
{{- end }}
{{- end }}
{{- end }}
{{- if .Values.tags.openmetadata }}
{{- with .Values.secrets.openmetadataDatabase }}
{{- if .create }}
---
apiVersion: v1
kind: Secret
metadata:
  name: openmetadata-db
  namespace: {{ $.Release.Namespace }}
  labels: {{- include "deps.labels" $ | nindent 4 }}
  annotations:
    naira.io/warning: "Generated from chart values. Development only."
type: Opaque
stringData:
  password: {{ required "secrets.openmetadataDatabase.password is required when create=true" .password | quote }}
{{- end }}
{{- end }}
{{- end }}
{{- if .Values.tags.langfuse }}
{{- with .Values.secrets.langfuseApp }}
{{- if .create }}
---
apiVersion: v1
kind: Secret
metadata:
  name: langfuse-app-credentials
  namespace: {{ $.Release.Namespace }}
  labels: {{- include "deps.labels" $ | nindent 4 }}
  annotations:
    naira.io/warning: "Generated from chart values. Development only."
    # Losing `salt` or `encryption-key` orphans every row written under it, so
    # the Secret outlives the release.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  salt: {{ required "secrets.langfuseApp.salt is required when create=true" .salt | quote }}
  encryption-key: {{ required "secrets.langfuseApp.encryptionKey is required when create=true" .encryptionKey | quote }}
  nextauth-secret: {{ required "secrets.langfuseApp.nextauthSecret is required when create=true" .nextauthSecret | quote }}
{{- end }}
{{- end }}
{{- with .Values.secrets.clickhouseAuth }}
{{- if .create }}
---
apiVersion: v1
kind: Secret
metadata:
  name: clickhouse-auth
  namespace: {{ $.Release.Namespace }}
  labels: {{- include "deps.labels" $ | nindent 4 }}
  annotations:
    naira.io/warning: "Generated from chart values. Development only."
type: Opaque
stringData:
  password: {{ required "secrets.clickhouseAuth.password is required when create=true" .password | quote }}
{{- end }}
{{- end }}
{{- end }}