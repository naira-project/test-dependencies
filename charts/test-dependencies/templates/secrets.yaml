{{- if .Values.tags.litellm }}
{{- with .Values.secrets.litellmMasterkey }}
{{- if .create }}
apiVersion: v1
kind: Secret
metadata:
  name: litellm-masterkey
  namespace: {{ $.Release.Namespace }}
  labels: {{- include "deps.labels" $ | nindent 4 }}
  annotations:
    naira.io/warning: "Generated from chart values. Development only."
type: Opaque
stringData:
  masterkey: {{ required "secrets.litellmMasterkey.value is required when create=true" .value | quote }}
---
{{- end }}
{{- end }}
{{- with .Values.secrets.litellmProviderKeys }}
{{- if .create }}
apiVersion: v1
kind: Secret
metadata:
  name: litellm-provider-keys
  namespace: {{ $.Release.Namespace }}
  labels: {{- include "deps.labels" $ | nindent 4 }}
  annotations:
    naira.io/warning: "Generated from chart values. Development only."
type: Opaque
stringData:
  {{- toYaml .data | nindent 2 }}
{{- end }}
{{- end }}
{{- end }}
{{- if .Values.tags.openmetadata }}
{{- with .Values.secrets.openmetadataMysql }}
{{- if .create }}
---
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secrets
  namespace: {{ $.Release.Namespace }}
  labels: {{- include "deps.labels" $ | nindent 4 }}
  annotations:
    naira.io/warning: "Generated from chart values. Development only."
type: Opaque
stringData:
  openmetadata-mysql-password: {{ required "secrets.openmetadataMysql.password is required when create=true" .password | quote }}
{{- end }}
{{- end }}
{{- end }}
