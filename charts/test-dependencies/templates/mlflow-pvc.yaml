{{/*
MLflow's SQLite store (mlflow.backendStore.defaultSqlitePath). Mounted by the
subchart through mlflow.extraVolumes; the claim name is fixed there.
*/}}
{{- if .Values.tags.mlflow }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlflow-data
  namespace: {{ .Release.Namespace }}
  labels: {{- include "deps.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.mlflowStorage }}
{{- end }}
