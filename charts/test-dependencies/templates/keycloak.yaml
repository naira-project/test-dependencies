{{- if .Values.tags.keycloak }}
{{- $secret := .Values.keycloak.admin.existingSecret | default (printf "%s-keycloak-admin" .Release.Name) }}
{{- if .Values.keycloak.admin.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secret }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "deps.labels" . | nindent 4 }}
  annotations:
    naira.io/warning: "Generated from chart values. Development only."
type: Opaque
stringData:
  username: {{ required "keycloak.admin.username is required when create=true" .Values.keycloak.admin.username | quote }}
  password: {{ required "keycloak.admin.password is required when create=true" .Values.keycloak.admin.password | quote }}
---
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm-import
  namespace: {{ .Release.Namespace }}
  labels: {{- include "deps.labels" . | nindent 4 }}
data:
  naira-realm.json: |
{{ .Files.Get "files/naira-realm.json" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: {{ .Release.Namespace }}
  labels: {{- include "deps.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {app: keycloak}
  template:
    metadata:
      labels:
        app: keycloak
        {{- include "deps.labels" . | nindent 8 }}
      annotations:
        checksum/realm: {{ .Files.Get "files/naira-realm.json" | sha256sum }}
    spec:
      containers:
        - name: keycloak
          image: {{ .Values.keycloak.image | quote }}
          args: ["start-dev", "--import-realm", "--health-enabled=true"]
          env:
            - name: KEYCLOAK_ADMIN
              valueFrom: {secretKeyRef: {name: {{ $secret }}, key: username}}
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ $secret }}, key: password}}
            - name: KC_HOSTNAME
              value: {{ .Values.keycloak.hostname | quote }}
            - name: KC_HOSTNAME_STRICT
              value: "false"
            - name: KC_HTTP_ENABLED
              value: "true"
          ports:
            - {containerPort: 8080, name: http}
            - {containerPort: 9000, name: health}
          volumeMounts:
            - {name: realm-import, mountPath: /opt/keycloak/data/import, readOnly: true}
          readinessProbe:
            httpGet: {path: /health/ready, port: health}
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet: {path: /health/live, port: health}
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 10
          resources: {{- toYaml .Values.keycloak.resources | nindent 12 }}
      volumes:
        - name: realm-import
          configMap: {name: keycloak-realm-import}
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: {{ .Release.Namespace }}
  labels: {{- include "deps.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {app: keycloak}
  ports:
    - {name: http, port: 8080, targetPort: http}
{{- end }}
