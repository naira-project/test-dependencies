{{- if and .Values.tags.monitoring .Values.tags.litellm }}
{{/* Same tag as kube-prometheus-stack, so the CRs never precede its CRDs. */}}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: litellm
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "deps.labels" . | nindent 4 }}
    # Prometheus selects ServiceMonitors by this label
    release: {{ .Release.Name }}
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: litellm}
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      # LiteLLM requires the proxy master key as a bearer token on every
      # route, including /metrics.
      authorization:
        credentials:
          name: {{ .Values.litellm.masterkeySecretName }}
          key: {{ .Values.litellm.masterkeySecretKey }}
{{- end }}
{{- if and .Values.tags.monitoring (or .Values.tags.llamacpp .Values.tags.vllm) }}
---
# One monitor for whichever backend is on: both Services carry the
# `inference` component label and expose /metrics on port `http`
# (llama.cpp via --metrics, vLLM natively).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: inference
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "deps.labels" . | nindent 4 }}
    release: {{ .Release.Name }}
spec:
  selector:
    matchLabels: {app.kubernetes.io/component: inference}
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
{{- end }}
{{- if and .Values.tags.monitoring .Values.tags.yace }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: yace
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "deps.labels" . | nindent 4 }}
    release: {{ .Release.Name }}
spec:
  selector:
    matchLabels:
      # Helm sets a subchart's .Chart.Name to its alias, hence yace.
      app.kubernetes.io/name: yace
      app.kubernetes.io/instance: {{ .Release.Name }}
  endpoints:
    - port: http
      path: /metrics
      interval: 60s
{{- end }}