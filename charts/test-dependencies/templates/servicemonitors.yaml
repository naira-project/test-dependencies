{{- if and .Values.tags.monitoring .Values.tags.litellm }}
{{/*
These are CRs of the operator kube-prometheus-stack installs. They ride its
flag so they can never be applied before the CRDs exist — the split between
`helm upgrade` and `kubectl apply` in the old Taskfile is what produced that
failure mode (RFC-009 §7).
*/}}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: litellm
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "deps.labels" . | nindent 4 }}
    # kube-prometheus-stack's Prometheus selects ServiceMonitors by this label.
    release: {{ .Release.Name }}
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: litellm}
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
{{- end }}
{{- if and .Values.tags.monitoring (or .Values.tags.llamacpp .Values.tags.vllm) }}
---
# One monitor for whichever backend is on: both Services carry the
# `inference` component label and expose /metrics on port `http`
# (llama.cpp via --metrics, vLLM natively).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: inference
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "deps.labels" . | nindent 4 }}
    release: {{ .Release.Name }}
spec:
  selector:
    matchLabels: {app.kubernetes.io/component: inference}
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
{{- end }}
