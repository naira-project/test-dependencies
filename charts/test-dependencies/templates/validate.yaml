{{/* Fails the release on invalid values. No leading underscore: a partial's `fail` never runs. */}}
{{- if and .Values.tags.llamacpp .Values.tags.vllm }}
{{- fail "tags.llamacpp and tags.vllm are mutually exclusive inference backends — enable one, not both" }}
{{- end }}
{{- if and .Values.tags.keycloak .Values.keycloak.admin.create .Values.keycloak.admin.existingSecret }}
{{- fail "keycloak.admin: set existingSecret or create, not both" }}
{{- end }}

{{- /* LiteLLM must not bring its own PostgreSQL. */}}
{{- if and .Values.tags.litellm .Values.litellm.db.deployStandalone }}
{{- fail "litellm.db.deployStandalone must be false: LiteLLM uses Naira's PostgreSQL (litellm.db.*)" }}
{{- end }}

{{- /* The Secret must carry the init script's literal password. */}}
{{- if and .Values.tags.openmetadata .Values.secrets.openmetadataMysql.create }}
{{- $pw := .Values.secrets.openmetadataMysql.password }}
{{- $sql := index .Values "openmetadata-dependencies" "mysql" "initdbScripts" "init_openmetadata_db_scripts.sql" | default "" }}
{{- if not (contains (printf "IDENTIFIED BY '%s'" $pw) $sql) }}
{{- fail "secrets.openmetadataMysql.password does not match the password in openmetadata-dependencies.mysql.initdbScripts" }}
{{- end }}
{{- end }}
