{{/*
Renders no objects — it exists to fail the release early.

NOTE: this file must NOT be named with a leading underscore. Helm treats
_*.tpl as partials: it parses them but never executes their top-level content,
so a `fail` in a partial silently never runs.

The one constraint tags cannot express: llamacpp and vllm are alternative
inference backends, not a pair (RFC-009 §1).
*/}}
{{- if and .Values.tags.llamacpp .Values.tags.vllm }}
{{- fail "tags.llamacpp and tags.vllm are mutually exclusive inference backends — enable one, not both" }}
{{- end }}
{{- if and .Values.tags.yace (not .Values.tags.monitoring) }}
{{- fail "tags.yace needs tags.monitoring: YACE is scraped through a ServiceMonitor, a CRD kube-prometheus-stack defines" }}
{{- end }}
{{- if and .Values.tags.keycloak .Values.keycloak.admin.create .Values.keycloak.admin.existingSecret }}
{{- fail "keycloak.admin: set existingSecret or create, not both" }}
{{- end }}

{{- /* LiteLLM must not bring its own PostgreSQL. */}}
{{- if and .Values.tags.litellm .Values.litellm.db.deployStandalone }}
{{- fail "litellm.db.deployStandalone must be false: LiteLLM uses Naira's PostgreSQL (litellm.db.*)" }}
{{- end }}

{{- /* OpenMetadata must not bring its own MySQL. */}}
{{- if and .Values.tags.openmetadata (index .Values "openmetadata-dependencies" "mysql" "enabled") }}
{{- fail "openmetadata-dependencies.mysql.enabled must be false: OpenMetadata uses Naira's PostgreSQL (openmetadata.openmetadata.config.database)" }}
{{- end }}
