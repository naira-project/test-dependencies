{{/*
Inference backends. Mutually exclusive — validate.yaml fails if both are on.
Simplified relative to deploy/dev/stacks/llm-inference: one replica, no model
pre-download init container. The model URL is a value, not a baked-in manifest.
*/}}
{{- range $name, $cfg := dict "llamacpp" .Values.llamacpp "vllm" .Values.vllm }}
{{- if index $.Values.tags $name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels: {{- include "deps.labels" $ | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {app: {{ $name }}}
  template:
    metadata:
      labels:
        app: {{ $name }}
        {{- include "deps.labels" $ | nindent 8 }}
    spec:
      containers:
        - name: {{ $name }}
          image: {{ $cfg.image | quote }}
          {{- with $cfg.args }}
          args: {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - {containerPort: 8080, name: http}
          resources: {{- toYaml $cfg.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels: {{- include "deps.labels" $ | nindent 4 }}
spec:
  type: ClusterIP
  selector: {app: {{ $name }}}
  ports:
    - {name: http, port: 8080, targetPort: http}
{{- end }}
{{- end }}
