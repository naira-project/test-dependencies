{{- if .Values.tags.mcpMock }}
{{- $reg := .Values.mcpMock.image.registry }}
{{- $img := printf "%s:%s" .Values.mcpMock.image.repository (.Values.mcpMock.image.tag | default .Chart.AppVersion) }}
{{- if $reg }}{{ $img = printf "%s/%s" $reg $img }}{{ end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-mock
  namespace: {{ .Release.Namespace }}
  labels: {{- include "deps.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {app: mcp-mock}
  template:
    metadata:
      labels:
        app: mcp-mock
        {{- include "deps.labels" . | nindent 8 }}
    spec:
      {{- with .Values.mcpMock.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: mcp-mock
          image: {{ $img | quote }}
          env:
            - {name: PORT, value: {{ .Values.mcpMock.port | quote }}}
          ports:
            - {containerPort: {{ .Values.mcpMock.port }}, name: http}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
          resources: {{- toYaml .Values.mcpMock.resources | nindent 12 }}
          securityContext:
            {{- include "deps.securityContext" . | nindent 12 }}
            # distroless nonroot; the image names its user, so give the uid
            runAsUser: 65532
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-mock
  namespace: {{ .Release.Namespace }}
  labels: {{- include "deps.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {app: mcp-mock}
  ports:
    - {name: http, port: {{ .Values.mcpMock.port }}, targetPort: http}
{{- end }}
