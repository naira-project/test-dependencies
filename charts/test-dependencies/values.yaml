# test-dependencies — the tier Naira talks to but does not ship (RFC-009 §1).
#
# NOTE: deliberately no `global.imageRegistry`. Helm globals propagate into
# every subchart, and litellm's bundled bitnami PostgreSQL honours that key —
# setting it rewrites bitnami's own images and trips their image-verification
# guard. First-party registries stay local to the component that needs one.

# ── what is installed ─────────────────────────────────────────────────────────
# One switch per component. Three are on: an operator who runs none of this
# gets a working environment. An adopter turns off what they already have.
#
# Tags, not `condition: <name>.enabled` — see the note in Chart.yaml.
tags:
  keycloak: true
  litellm: true          # includes its own PostgreSQL
  mlflow: true
  mcpMock: false          # test double; on in values-dev.yaml
  langfuse: false        # Langfuse, its three bundled stores and ClickHouse
  openmetadata: false
  monitoring: false      # kube-prometheus-stack AND the ServiceMonitors
  llamacpp: false
  vllm: false

# ── Secrets this chart can create ─────────────────────────────────────────────
# Fixed names; the litellm subchart below is pointed at them. Default: the
# operator supplies them (ExternalSecret). create: true is for kind and e2e.
secrets:
  litellmMasterkey:
    create: false
    value: ""
  litellmProviderKeys:
    create: false
    data: {}
  # Secret `mysql-secrets` (key openmetadata-mysql-password): the password of
  # MySQL user openmetadata_user, which upstream's init script creates with the
  # literal `openmetadata_password` (openmetadata-dependencies.mysql.initdbScripts).
  # Helm cannot template subchart values, so the two are kept equal by hand and
  # checked by tests/render-test.sh. Change both or neither.
  openmetadataMysql:
    create: false
    password: openmetadata_password
  # Secret `langfuse-app-credentials`, read through the secretKeyRefs in the
  # langfuse block below. The subchart would otherwise generate all three with
  # `randAlphaNum`, re-rolled on every render — and a rotated SALT or
  # ENCRYPTION_KEY orphans every row written under the old one.
  langfuseApp:
    create: false
    salt: ""            # `openssl rand -base64 32`
    encryptionKey: ""   # 64 hex chars — `openssl rand -hex 32`
    nextauthSecret: ""  # `openssl rand -base64 32`
  # Secret `clickhouse-auth` (key password), read by both ends: the ClickHouse
  # StatefulSet this chart renders and the Langfuse pods that connect to it.
  clickhouseAuth:
    create: false
    password: ""

# ── on by default ─────────────────────────────────────────────────────────────

keycloak:
  # files/naira-realm.json carries development-only credentials: client secret
  # naira-local-dev-secret, user testuser/testpass, registration open, SSL not
  # required. Replace it for any shared environment.
  image: quay.io/keycloak/keycloak:26.6.4
  realm: naira
  # Browser-facing hostname. Port-forwarded in every environment reached from
  # a laptop, which is why it is localhost and not a cluster DNS name.
  hostname: http://localhost:8080
  admin:
    # Same rule as everywhere else: supply the Secret, do not commit it.
    # Default path (create: false, existingSecret: ""): the Deployment reads
    # a Secret named <release name>-keycloak-admin with keys username and
    # password, which the operator must supply (for example an ExternalSecret).
    existingSecret: ""
    create: false
    username: ""
    password: ""
  resources:
    requests: {cpu: 200m, memory: 512Mi}
    limits: {cpu: 1000m, memory: 1Gi}

litellm:
  fullnameOverride: litellm
  # Never let the subchart generate a key: it re-randomises on every render.
  masterkeySecretName: litellm-masterkey
  masterkeySecretKey: masterkey
  environmentSecrets: [litellm-provider-keys]
  replicaCount: 1
  service: {type: ClusterIP, port: 4000}
  ingress: {enabled: false}
  # The bundled PostgreSQL. This is the tier's database.
  postgresql:
    architecture: standalone
    image:
      # Pinned: the subchart's default is bitnami/postgresql:latest, a moving
      # tag whose major can change under an existing data volume.
      registry: registry-1.docker.io
      repository: bitnamilegacy/postgresql
      tag: 17.6.0-debian-12-r4
    auth:
      # litellm-helm renders litellm-dbcredentials from these two values and
      # also writes `password` into the migration Job's DATABASE_URL as a plain
      # value, so no Secret can hold it instead. Set both per environment;
      # templates/validate.yaml rejects empty values and the upstream sample.
      existingSecret: litellm-dbcredentials
      password: ""
      postgres-password: ""
    primary:
      resources:
        requests: {cpu: 100m, memory: 256Mi}
        limits: {cpu: 500m, memory: 512Mi}
  migrationJob: {enabled: true}
  proxyConfigMap: {create: true, key: config.yaml}
  proxy_config:
    model_list:
      - model_name: chat-small
        litellm_params:
          model: mistral/mistral-small-latest
          api_key: os.environ/MISTRAL_API_KEY
          api_base: https://api.mistral.ai/v1
  resources:
    requests: {cpu: 200m, memory: 512Mi}
    # 1Gi is not enough — LiteLLM OOMKills on startup. component-testbed's
    # Flux HelmRelease already carries 2Gi; this matches it.
    limits: {memory: 2Gi}

mlflow:
  fullnameOverride: mlflow
  replicaCount: 1
  service: {enabled: true, type: ClusterIP, port: 5000}
  backendStore:
    databaseMigration: false
    # Upstream's default is ":memory:", which SQLAlchemy opens once per
    # connection: tables and seeded data on one are missing on the next
    # ("no such table: runs"). The file lives on the mlflow-data PVC
    # (templates/mlflow-pvc.yaml, size in mlflowStorage below), so the seed
    # survives a pod restart.
    defaultSqlitePath: /mlflow/data/mlflow.db
  extraVolumes:
    - {name: data, persistentVolumeClaim: {claimName: mlflow-data}}
  extraVolumeMounts:
    - {name: data, mountPath: /mlflow/data}
  # One SQLite file on a ReadWriteOnce volume: the old pod must stop before
  # the new one opens it. The subchart's fsGroup 1001 makes the volume
  # writable for its uid 1001.
  strategy:
    type: Recreate
  # MLflow 3.x binds localhost-only and its security middleware rejects
  # requests from anywhere else — including the kubelet's probes, so the
  # container restarts forever. The chart already passes --host 0.0.0.0;
  # allowed-hosts is the missing half.
  #
  # workers=1 because the chart defaults to 4 and each loads the full stack:
  # four of them OOMKill inside 1Gi.
  extraArgs:
    allowed-hosts: "*"
    workers: "1"
  # Keep BLAS from grabbing every core on a kind node — the same fix
  # component-testbed already carries for its Flux HelmRelease.
  extraEnvVars:
    OPENBLAS_NUM_THREADS: "1"
    OMP_NUM_THREADS: "1"
    MKL_NUM_THREADS: "1"
    NUMEXPR_NUM_THREADS: "1"
    VECLIB_MAXIMUM_THREADS: "1"
  resources:
    requests: {cpu: 200m, memory: 512Mi}
    limits: {cpu: 1000m, memory: 2Gi}

# PVC mlflow-data, holding MLflow's SQLite store. A parent key: the mlflow
# subchart's values schema rejects keys it does not define.
mlflowStorage: 1Gi

mcpMock:
  # Test double backing the catalog's mcp-servers plugin. Never in a release.
  # Source: images/mcp-mock; published for amd64 and arm64 by
  # .github/workflows/mcp-mock-image.yml as <appVersion>, sha-<commit>, main
  # and latest; a published appVersion tag is immutable.
  image:
    registry: ghcr.io/naira-project
    repository: test-dependencies/mcp-mock
    tag: ""           # default: the chart's appVersion
  # ghcr packages are private until made public. Until then the cluster needs
  # a docker-registry Secret (read:packages) in this namespace, named here.
  imagePullSecrets: []   # e.g. [{name: ghcr-pull}]
  port: 8080
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 200m, memory: 128Mi}

# ── sample data ───────────────────────────────────────────────────────────────
# One Job per component (templates/seed.yaml), rendered only when the
# component's tag is on too. Off by default; on in values-dev.yaml.
seed:
  backoffLimit: 10       # retries with backoff while the server starts
  mlflow:
    enabled: false
    # The mlflow subchart's own image: it has mlflow, pandas and numpy, so
    # nothing is installed at runtime. Keep in step with the subchart.
    image: burakince/mlflow:3.16.0
  openmetadata:
    enabled: false
    image: python:3.13-slim
    requests: requests==2.32.3   # installed by the Job at start
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}

# ── off by default ────────────────────────────────────────────────────────────

# ClickHouse, for Langfuse. Rendered here (templates/clickhouse.yaml) and not
# by the langfuse subchart, whose ClickHouse is a pair of operator CRs — that
# would make the ClickHouse operator and cert-manager prerequisites of this
# chart. Rides tags.langfuse; deploy: false points Langfuse at a ClickHouse that
# already runs (langfuse.clickhouse.host below must name it).
clickhouse:
  deploy: true
  # What Langfuse recommends for 4.x, the version its operator CRs pin too.
  # Moves with the subchart.
  image: clickhouse/clickhouse-server:26.4
  # Fixed in the image (`useradd --uid=101`), deliberately, so that volume
  # ownership can be arranged from outside. Must match it; not a knob.
  uid: 101
  # Kept equal to langfuse.clickhouse.auth.username and .database by hand —
  # Helm cannot template subchart values. validate.yaml rejects a drifted pair.
  user: default
  database: default
  storage: 10Gi
  resources:
    requests: {cpu: 500m, memory: 1Gi}
    limits: {memory: 2Gi}

# Langfuse — LLM observability, the tier's counterpart to LiteLLM's gateway.
# PostgreSQL, Valkey and SeaweedFS ride along as subcharts; ClickHouse is this
# chart's own, above. Off by default for its size: six workloads, four of them
# on persistent volumes.
langfuse:
  # The web UI is langfuse-web.<namespace>.svc:3000.
  fullnameOverride: langfuse
  langfuse:
    # The three credentials Langfuse cannot regenerate (secrets.langfuseApp).
    # Always by reference, whether or not this chart creates that Secret:
    # pointing at it is what stops the subchart generating them.
    salt:
      secretKeyRef: {name: langfuse-app-credentials, key: salt}
    encryptionKey:
      secretKeyRef: {name: langfuse-app-credentials, key: encryption-key}
    nextauth:
      # Browser-facing, same rule as keycloak.hostname: port-forwarded wherever
      # a laptop reaches it.
      url: http://localhost:3002
      secret:
        secretKeyRef: {name: langfuse-app-credentials, key: nextauth-secret}
    features:
      # A test tier does not report usage to langfuse.com.
      telemetryEnabled: false
    image:
      # The tag is already pinned to appVersion
      pullPolicy: IfNotPresent
    extraInitContainers:
      - name: wait-for-postgresql
        image: postgres:18
        command: ["sh", "-c", "until pg_isready -h langfuse-postgresql -p 5432; do sleep 2; done"]
        resources:
          requests: {cpu: 10m, memory: 32Mi}
          limits: {memory: 64Mi}
    web:
      livenessProbe:
        failureThreshold: 30
      resources:
        requests: {cpu: 200m, memory: 1Gi}
        limits: {memory: 2Gi}
    worker:
      livenessProbe:
        # The worker does not exit, it answers 500 while it waits on web's
        # ClickHouse migrations — long enough for upstream's threshold to kill
        # it. Measured: one restart before this, none after.
        failureThreshold: 30
      resources:
        requests: {cpu: 200m, memory: 768Mi}   # measured ~565Mi idle
        limits: {memory: 2Gi}
  # Langfuse's own PostgreSQL, separate from litellm's. fullnameOverride is not
  # cosmetic: both subcharts default to <release>-postgresql, so with both tags
  # on the StatefulSets and Services collide and the install is rejected. The
  # other two stores are renamed for symmetry; langfuse resolves its hostnames
  # through these same keys.
  postgresql:
    # true renders the bundled server below; false renders none of it and
    # points Langfuse at a server that already exists — managed, or one this
    # tier shares. The keys down to `auth` are that switch.
    deploy: true
    host: ""                # required when deploy: false, i.e. when we want to connect it to already hosted postgresql (validate.yaml)
    port: null              # 5432 unless set
    # For a connection through a pooler: migrations need to reach the server
    # directly, and a user without CREATE DATABASE needs a shadow database.
    directUrl: ""
    shadowDatabaseUrl: ""
    fullnameOverride: langfuse-postgresql
    auth:
      # Which database and role Langfuse uses — created by the subchart when
      # deploy is true, selected on the server when it is false.
      database: langfuse
      username: langfuse
      # A bundled store's password, generated with `randAlphaNum` when left
      # empty — kept by `lookup` on a live upgrade, but re-rolled by any render
      # that cannot read the cluster, which is every Argo CD diff. Set per
      # environment; templates/validate.yaml rejects the empty value while the
      # store is ours. Not held in a Secret of this chart's making: langfuse
      # bootstraps its subcharts from Secrets it writes itself, so
      # `existingSecret` here would mean rebuilding them.
      password: ""
      # The other half of deploy: false — the operator's Secret holding the
      # password of the server Langfuse connects to. Ignored, and left empty,
      # while the bundled server is the one in use.
      existingSecret: ""
      secretKeys:
        userPasswordKey: password
    storage:
      requestedSize: 5Gi
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {memory: 512Mi}
  redis:
    fullnameOverride: langfuse-valkey
    auth:
      password: ""
    dataStorage:
      requestedSize: 2Gi
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {memory: 256Mi}
  s3:
    # true renders the bundled SeaweedFS below, an S3 gateway for a cluster
    # with no object storage of its own; false renders none of it and points
    # Langfuse at an external S3. Nothing in this block is required, because
    # what a given environment needs differs: against AWS the endpoint stays
    # empty so the SDK resolves it from the region, path style goes off for
    # virtual-hosted buckets, and the credentials below stay empty too —
    # an IRSA role on langfuse.serviceAccount beats long-lived keys. An
    # S3-compatible server (MinIO, Ceph) is the opposite: a named endpoint,
    # path style on, and keys by reference.
    deploy: true
    storageProvider: s3     # or azure, gcs
    bucket: langfuse
    region: auto
    endpoint: ""            # empty on AWS; the server's URL otherwise
    forcePathStyle: true    # false for AWS
    # By reference, never by value. `value:` exists upstream and is the reason
    # to say so: a key written here lands in the rendered Deployment.
    accessKeyId:
      secretKeyRef: {name: "", key: ""}
    secretAccessKey:
      secretKeyRef: {name: "", key: ""}
    # eventUpload, batchExport and mediaUpload each override all of the above
    # when one of them needs a bucket of its own.
    fullnameOverride: langfuse-s3
    auth:
      rootPassword: ""
    # Not pinnable, unlike the passwords above: seaweedfs renders an SFTP Secret
    # whenever allInOne is on (sftp.enabled stays false, no SFTP pod is ever
    # created) and generates its three passwords with no values hook to supply
    # them. So `langfuse-s3-sftp-secret` is the one object in a langfuse render
    # that changes every time — an auto-synced Application will rewrite
    # credentials that nothing reads. tests/render-test.sh holds it to that one.
    allInOne:
      data:
        size: 5Gi
      resources:
        requests: {cpu: 100m, memory: 256Mi}
        limits: {cpu: 1, memory: 1Gi}
  clickhouse:
    # Off: the subchart's ClickHouse is a pair of operator CRs. The server in
    # templates/clickhouse.yaml answers on this Service instead, reading the
    # same Secret — the one store whose credential this chart owns both ends of.
    deploy: false
    host: clickhouse
    auth:
      existingSecret: clickhouse-auth
      existingSecretKey: password
    cluster:
      # No ON CLUSTER DDL: one server, no Keeper. Langfuse migrates with plain
      # statements when this is off.
      enabled: false

# The dependency tier the OpenMetadata server needs. Airflow (ingestion
# orchestration) is off: the Naira plugin only reads the REST API, Airflow
# needs a ReadWriteMany volume kind cannot provide, and its memory pushed
# OpenSearch into OOM on a single node.
openmetadata-dependencies:
  airflow:
    enabled: false
  mysql:
    auth:
      # Fixed so renders are deterministic (bitnami mysql otherwise generates
      # random passwords on every render). Root/app-user passwords of a
      # database that only OpenMetadata reaches; override per environment.
      rootPassword: openmetadata-mysql-root
      password: openmetadata-mysql-user
    # openmetadata_user exists only because of this script (upstream default,
    # restated here so the password is visible next to secrets.openmetadataMysql).
    initdbScripts:
      init_openmetadata_db_scripts.sql: |
        CREATE DATABASE openmetadata_db;
        CREATE USER 'openmetadata_user'@'%' IDENTIFIED BY 'openmetadata_password';
        GRANT ALL PRIVILEGES ON openmetadata_db.* TO 'openmetadata_user'@'%' WITH GRANT OPTION;
        commit;

# The server. Basic auth; the built-in `admin` user is created on first start
# with password `admin` (upstream default, not configurable here) — the naira
# chart's dev values log the plugin in with exactly that.
openmetadata:
  fullnameOverride: openmetadata   # reachable as openmetadata.<namespace>.svc:8585
  openmetadata:
    config:
      # No Airflow, so the server must not health-check a pipeline service.
      # auth off as well: upstream still mounts the Airflow password Secret
      # otherwise, and the pod never starts without it.
      pipelineServiceClientConfig:
        enabled: false
        airflow:
          auth:
            enabled: false


# kube-prometheus-stack: only what determinism needs. Grafana otherwise
# generates a random admin password on every render, which an auto-synced
# Application can never settle on. Override per environment.
kube-prometheus-stack:
  grafana:
    adminPassword: grafana-local-admin

servicemonitors:
  # Gated by tags.monitoring together with kube-prometheus-stack, so the CRs
  # can never be applied before the operator that defines them.
  catalogPort: 8090

llamacpp:
  image: ghcr.io/ggml-org/llama.cpp:server
  downloadImage: curlimages/curl:8.11.1
  storage: 3Gi        # model cache PVC, shared by all models below
  # The download image runs unprivileged and a CSI-provisioned volume (EBS)
  # is root-owned: without fsGroup the download fails with "Permission
  # denied". kind's hostPath provisioner is world-writable and hides that.
  fsGroup: 1000
  # One Deployment and Service per entry. `name` is the Service name.
  models:
    - name: llama-qwen25-05b
      modelFile: qwen2.5-0.5b-instruct-q4_k_m.gguf
      downloadUrl: https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf
      contextSize: "512"
      threads: "2"
      readinessDelay: 2
      resources:
        requests: {cpu: 300m, memory: 256Mi}
        limits: {cpu: 2000m, memory: 1Gi}
    - name: llama-dummy-model
      modelFile: tiny-llama3-test-q2_k.gguf
      downloadUrl: https://huggingface.co/tensorblock/tiny-llama3-test-GGUF/resolve/main/tiny-llama3-test-Q2_K.gguf
      readinessDelay: 1
      resources:
        requests: {cpu: 50m, memory: 64Mi}
        limits: {cpu: 200m, memory: 128Mi}

vllm:
  image: vllm/vllm-openai-cpu:latest
  model: facebook/opt-125m
  servedModelName: opt-125m
  kvCacheSpace: "1"   # GiB of CPU KV cache
  resources:
    requests: {cpu: 500m, memory: 1Gi}
    limits: {cpu: 1000m, memory: 4Gi}
