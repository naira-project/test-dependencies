# test-dependencies: the third-party tier Naira talks to (RFC-009 §1).

# One tag per component (tags, not conditions: see Chart.yaml).
tags:
  keycloak: true
  litellm: true          # database on Naira's PostgreSQL
  mlflow: true
  mcpMock: false          # test double; on in values-dev.yaml
  langfuse: false        # Langfuse, its three bundled stores and ClickHouse
  openmetadata: false
  monitoring: false      # kube-prometheus-stack and the ServiceMonitors
  llamacpp: false
  vllm: false
  yace: false            # CloudWatch exporter; needs tags.monitoring and AWS credentials

# Secrets with fixed names. create: false means the operator supplies them.
secrets:
  litellmMasterkey:
    create: false
    value: ""
  litellmProviderKeys:
    create: false
    data: {}
  # Secret litellm-db (keys username, password). Password must equal the naira
  # chart's database.databases.litellm password.
  litellmDatabase:
    create: false
    username: litellm
    password: ""
  # Secret openmetadata-db (key password). Password must equal the naira chart's
  # database.databases.openmetadata password. Username: openmetadata.openmetadata.config.database.auth.username.
  openmetadataDatabase:
    create: false
    password: ""
  # Secret `yace-aws-credentials` (keys access_key, secret_key), read by YACE
  # (yace.aws.secret.name). Never put the values in a file: pass them at install,
  # --set secrets.yaceAws.accessKey=$AWS_ACCESS_KEY_ID ... Default: the operator
  # supplies the Secret.
  #
  # This chart does not create the keys, it only copies them into the Secret. Create a dedicated IAM user (no console access) in AWS,
  # attach the read-only policy below, then IAM > user > Security credentials >
  # Create access key. AWS shows the secret key once, so store it then. With
  # create: true the keys sit in the Secret only base64-encoded: development
  # only. In a shared environment keep create: false and supply the Secret
  # (e.g. an ExternalSecret).
  #
  # Access needed: read-only CloudWatch metrics, nothing else (YACE reads
  # AWS/Bedrock only and never changes anything). CloudWatch read actions do not
  # support resource-level restrictions, hence Resource "*".
  #   {
  #     "Version": "2012-10-17",
  #     "Statement": [{
  #       "Sid": "YaceCloudWatchRead",
  #       "Effect": "Allow",
  #       "Action": [
  #         "cloudwatch:ListMetrics",
  #         "cloudwatch:GetMetricData",
  #         "cloudwatch:GetMetricStatistics"
  #       ],
  #       "Resource": "*"
  #     }]
  #   }
  yaceAws:
    create: false
    accessKey: ""
    secretKey: ""
  # Secret langfuse-app-credentials, passed to the subchart by secretKeyRef
  # (langfuse.langfuse.*): without that it regenerates these three on every render,
  # orphaning encrypted provider credentials and invalidating every API key.
  langfuseApp:
    create: false
    salt: ""            # hashes API keys — `openssl rand -base64 32`
    encryptionKey: ""   # encrypts provider credentials; 64 hex — `openssl rand -hex 32`
    nextauthSecret: ""  # signs sessions — `openssl rand -base64 32`
  # Secret langfuse-db (keys username, password). Password must equal the naira
  # chart's database.databases.langfuse password. Langfuse reads only password.
  langfuseDatabase:
    create: false
    username: langfuse
    password: ""
  # Secret clickhouse-auth (key password), read by both ends: the ClickHouse
  # StatefulSet this chart renders and the Langfuse pods that connect to it.
  clickhouseAuth:
    create: false
    password: ""
# ── on by default ─────────────────────────────────────────────────────────────

keycloak:
  image: quay.io/keycloak/keycloak:26.6.4
  realmImport:
    # Empty: bundled files/naira-realm.json (dev credentials). Otherwise a ConfigMap of *.json realms.
    existingConfigMap: ""
  hostname: http://localhost:8080   # browser-facing; reached via port-forward
  admin:
    # Default: operator supplies Secret <release>-keycloak-admin (keys username, password).
    existingSecret: ""
    create: false
    username: ""
    password: ""
  resources:
    requests: {cpu: 200m, memory: 512Mi}
    limits: {cpu: 1000m, memory: 1Gi}

litellm:
  fullnameOverride: litellm
  image: {tag: v1.84.0}
  # Fixed Secret: the subchart would otherwise generate a new key on every render.
  masterkeySecretName: litellm-masterkey
  masterkeySecretKey: masterkey
  environmentSecrets: [litellm-provider-keys]
  replicaCount: 1
  service: {type: ClusterIP, port: 4000}
  ingress: {enabled: false}
  # Own database on Naira's PostgreSQL, created by the naira chart's db-init Job
  # (database.databases.litellm). Install naira first; LiteLLM retries until then.
  db:
    deployStandalone: false
    useExisting: true
    endpoint: postgres.idp-system.svc.cluster.local:5432
    database: litellm
    secret: {name: litellm-db, usernameKey: username, passwordKey: password}
  # The proxy migrates at startup; the upstream Job is an Argo PreSync hook that never finishes here.
  migrationJob: {enabled: false}
  startupProbe: {failureThreshold: 90}   # 15 min for the first migration
  proxyConfigMap: {create: true, key: config.yaml}
  proxy_config:
    model_list:
      - model_name: chat-small
        litellm_params:
          model: mistral/mistral-small-latest
          api_key: os.environ/MISTRAL_API_KEY
          api_base: https://api.mistral.ai/v1
    litellm_settings:
      callbacks: [prometheus]   # serves /metrics (404 without)
      prometheus_initialize_budget_metrics: true
      require_auth_for_metrics_endpoint: true
  # INFO logs one line per request naming the upstream model, which is what
  # the UI's "View Logs" link filters the proxy's logs on.
  envVars:
    LITELLM_LOG: INFO
  resources:
    requests: {cpu: 200m, memory: 512Mi}
    limits: {memory: 2Gi}   # 1Gi OOMKills on startup

mlflow:
  fullnameOverride: mlflow
  replicaCount: 1
  service: {enabled: true, type: ClusterIP, port: 5000}
  backendStore:
    databaseMigration: false
    # SQLite on the mlflow-data PVC; upstream's :memory: loses tables between connections.
    defaultSqlitePath: /mlflow/data/mlflow.db
  extraVolumes:
    - {name: data, persistentVolumeClaim: {claimName: mlflow-data}}
  extraVolumeMounts:
    - {name: data, mountPath: /mlflow/data}
  # The server refuses an out-of-date schema unless a table is missing. Image must equal the server's.
  initContainers:
    - name: db-upgrade
      image: burakince/mlflow:3.16.0
      command: [sh, -c, 'if [ -f /mlflow/data/mlflow.db ]; then mlflow db upgrade sqlite:////mlflow/data/mlflow.db; fi']
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: {drop: [ALL]}
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      volumeMounts:
        - {name: data, mountPath: /mlflow/data}
        - {name: tmp, mountPath: /tmp}
  strategy:
    type: Recreate   # one SQLite file on a ReadWriteOnce volume
  extraArgs:
    allowed-hosts: "*"   # else MLflow 3.x rejects the kubelet's probes
    workers: "1"         # 4 workers OOMKill
  extraEnvVars:
    OPENBLAS_NUM_THREADS: "1"
    OMP_NUM_THREADS: "1"
    MKL_NUM_THREADS: "1"
    NUMEXPR_NUM_THREADS: "1"
    VECLIB_MAXIMUM_THREADS: "1"
  resources:
    requests: {cpu: 200m, memory: 512Mi}
    limits: {cpu: 1000m, memory: 2Gi}

# Size of PVC mlflow-data. Top-level: the mlflow subchart's schema rejects unknown keys.
mlflowStorage: 1Gi

mcpMock:
  # Test double for the catalog's mcp-servers plugin (images/mcp-mock).
  image:
    registry: ghcr.io/naira-project
    repository: test-dependencies/mcp-mock
    tag: ""           # default: the chart's appVersion
  imagePullSecrets: []   # needed while the ghcr package is private, e.g. [{name: ghcr-pull}]
  port: 8080
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 200m, memory: 128Mi}

# ── sample data (templates/seed.yaml) ─────────────────────────────────────────
seed:
  backoffLimit: 10       # retries while the server starts
  mlflow:
    enabled: false
    image: burakince/mlflow:3.16.0   # keep equal to the mlflow subchart's image
  openmetadata:
    enabled: false
    image: python:3.13-slim
    requests: requests==2.32.3   # installed by the Job at start
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}

# ── off by default ────────────────────────────────────────────────────────────

# ClickHouse for Langfuse, rendered here (templates/clickhouse.yaml): the
# subchart's is a pair of operator CRs, which would make the ClickHouse operator
# and cert-manager prerequisites of this chart. Rides tags.langfuse.
clickhouse:
  deploy: true        # false points Langfuse at an existing server (langfuse.clickhouse.host)
  # Pinned by digest: 26.4 moves. Keep in step with the subchart's ClickHouse.
  image: clickhouse/clickhouse-server:26.4@sha256:c7796a1335d14385c052f10061cf719f4a368a908432ec25980860b1333e9ccd
  uid: 101            # fixed in the image (`useradd --uid=101`), so ownership can be set from outside
  # Kept equal to langfuse.clickhouse.auth.username and .database by hand; validate.yaml rejects drift.
  user: default
  database: default
  storage: 10Gi
  storageClass: ""    # empty: the cluster's default class
  resources:
    requests: {cpu: 500m, memory: 1Gi}
    limits: {memory: 2Gi}

# Langfuse — LLM observability, the tier's counterpart to LiteLLM's gateway.
# PostgreSQL, Valkey and SeaweedFS ride along as subcharts; ClickHouse is this
# chart's own, above. Off by default: six workloads, four on persistent volumes.
langfuse:
  fullnameOverride: langfuse   # web UI at langfuse-web.<namespace>.svc:3000
  langfuse:
    # secrets.langfuseApp, always by reference: that is what stops the subchart generating them.
    salt: {secretKeyRef: {name: langfuse-app-credentials, key: salt}}
    encryptionKey: {secretKeyRef: {name: langfuse-app-credentials, key: encryption-key}}
    nextauth:
      url: http://localhost:3002   # browser-facing; reached via port-forward
      secret: {secretKeyRef: {name: langfuse-app-credentials, key: nextauth-secret}}
    features: {telemetryEnabled: false}   # a test tier does not report usage to langfuse.com
    image: {pullPolicy: IfNotPresent}     # the tag is already pinned to appVersion
    # The host is literal: a subchart value cannot be templated and the container
    # reads no env. validate.yaml rejects it naming a server deploy does not create.
    extraInitContainers:
      - name: wait-for-postgresql
        # Pinned by digest: 18 moves.
        image: postgres:18@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
        # langfuse-web exits 1 on P1001 rather than retrying, unlike litellm.
        command: ["sh", "-c", "until pg_isready -h postgres.idp-system.svc.cluster.local -p 5432; do sleep 2; done"]
        resources:
          requests: {cpu: 10m, memory: 32Mi}
          limits: {memory: 64Mi}
    web:
      livenessProbe: {failureThreshold: 30}
      resources:
        requests: {cpu: 200m, memory: 1Gi}
        limits: {memory: 2Gi}
    worker:
      # Answers 500 while it waits on web's ClickHouse migrations; upstream's threshold kills it first.
      livenessProbe: {failureThreshold: 30}
      resources:
        requests: {cpu: 200m, memory: 768Mi}   # measured ~565Mi idle
        limits: {memory: 2Gi}
  # Own database on Naira's PostgreSQL, created by the naira chart's db-init Job
  # (database.databases.langfuse). Install naira first. deploy stays false, like
  # litellm's and openmetadata's; validate.yaml rejects a server of its own.
  postgresql:
    deploy: false
    host: postgres.idp-system.svc.cluster.local
    port: 5432
    auth:
      database: langfuse
      username: langfuse
      # Secret langfuse-db (secrets.langfuseDatabase); only its `password` key is read.
      existingSecret: langfuse-db
      secretKeys: {userPasswordKey: password}
  redis:
    # Valkey, bundled — Langfuse's queue, not a cache. false points at an existing
    # server, and is also what the subchart's cluster and sentinel modes require.
    deploy: true
    host: ""                # required when deploy: false (validate.yaml)
    port: 6379
    fullnameOverride: langfuse-valkey
    tls: {enabled: false}   # for a managed instance; caPath, certPath and keyPath sit alongside
    auth:
      username: default
      database: 0
      # Generated when left empty; validate.yaml rejects that while the store is ours.
      password: ""
      # The deploy: false half, as for PostgreSQL above.
      existingSecret: ""
      existingSecretPasswordKey: ""
    # Upstream pins `maxmemory-policy noeviction` and rejects anything else — the
    # job queue lives in this store, so eviction loses work.
    dataStorage: {requestedSize: 2Gi, className: ""}
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {memory: 256Mi}
  s3:
    # true renders the bundled SeaweedFS below; false points Langfuse at an
    # external S3. Nothing below is required: AWS wants an empty endpoint, path
    # style off and an IRSA role rather than keys; MinIO and Ceph the opposite.
    deploy: true
    storageProvider: s3     # or azure, gcs
    bucket: langfuse
    region: auto
    endpoint: ""            # empty on AWS; the server's URL otherwise
    forcePathStyle: true    # false for AWS
    # By reference, never by value: upstream's `value:` lands in the Deployment.
    accessKeyId: {secretKeyRef: {name: "", key: ""}}
    secretAccessKey: {secretKeyRef: {name: "", key: ""}}
    # eventUpload, batchExport and mediaUpload each override all of the above.
    fullnameOverride: langfuse-s3
    auth: {rootPassword: ""}
    # seaweedfs renders an SFTP Secret whenever allInOne is on and generates its
    # passwords with no values hook, so langfuse-s3-sftp-secret is the one object
    # that changes per render. Nothing reads it; tests/render-test.sh holds it to that.
    allInOne:
      data:
        size: 5Gi
        # seaweedfs calls it storageClass, not className.
        storageClass: ""    # empty: the cluster's default class
      resources:
        requests: {cpu: 100m, memory: 256Mi}
        limits: {cpu: 1, memory: 1Gi}
  clickhouse:
    # Off: the subchart's is a pair of operator CRs. templates/clickhouse.yaml
    # answers on this Service instead, reading the same Secret.
    deploy: false
    host: clickhouse
    auth: {existingSecret: clickhouse-auth, existingSecretKey: password}
    # One server, no Keeper: Langfuse migrates without ON CLUSTER DDL.
    cluster: {enabled: false}

# Airflow off: the plugin only reads the REST API, and it needs ReadWriteMany.
# MySQL off: OpenMetadata uses its own database on Naira's PostgreSQL.
openmetadata-dependencies:
  airflow:
    enabled: false
  mysql:
    enabled: false

# Built-in user admin/admin (upstream default).
openmetadata:
  fullnameOverride: openmetadata
  openmetadata:
    config:
      # Own database on Naira's PostgreSQL, created by the naira chart's db-init Job
      # (database.databases.openmetadata). Install naira first.
      database:
        host: postgres.idp-system.svc.cluster.local
        port: 5432
        driverClass: org.postgresql.Driver
        dbScheme: postgresql
        databaseName: openmetadata
        auth:
          username: openmetadata   # plain value: the subchart cannot read it from a Secret
          password: {secretRef: openmetadata-db, secretKey: password}
        dbParams: sslmode=disable
        # Main pool only (upstream 10-50); OpenMetadata opens ~17 more outside it.
        # The shared server allows 100 (LiteLLM and the catalog included).
        initialSize: 2
        minSize: 2
        maxSize: 10
      # No Airflow; with auth on, upstream mounts a Secret that does not exist.
      pipelineServiceClientConfig:
        enabled: false
        airflow:
          auth:
            enabled: false

kube-prometheus-stack:
  grafana:
    adminPassword: grafana-local-admin
    additionalDataSources:
      - {name: Loki, type: loki, uid: loki, access: proxy, url: "http://loki:3100"}

llamacpp:
  # Pinned by digest: `server` moves.
  image: ghcr.io/ggml-org/llama.cpp:server@sha256:c789283572ba78c2699b8945a96e654c850f938a717883f2e6187a14adac698f
  downloadImage: curlimages/curl:8.11.1
  storage: 3Gi        # model cache PVC per model; a model's `storage` overrides it
  fsGroup: 1000       # EBS volumes are root-owned; the download runs unprivileged
  # One Deployment and Service per entry. `name` is the Service name.
  models:
    - name: llama-qwen25-05b
      modelFile: qwen2.5-0.5b-instruct-q4_k_m.gguf
      downloadUrl: https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf
      contextSize: "512"
      threads: "2"
      readinessDelay: 2
      resources:
        requests: {cpu: 300m, memory: 256Mi}
        limits: {cpu: 2000m, memory: 1Gi}
    - name: llama-dummy-model
      modelFile: tiny-llama3-test-q2_k.gguf
      downloadUrl: https://huggingface.co/tensorblock/tiny-llama3-test-GGUF/resolve/main/tiny-llama3-test-Q2_K.gguf
      readinessDelay: 1
      resources:
        requests: {cpu: 50m, memory: 64Mi}
        limits: {cpu: 200m, memory: 128Mi}

vllm:
  # Pinned by digest: `latest` moves.
  image: vllm/vllm-openai-cpu:v0.31.0@sha256:495c84fe30f3572b83a78100a1e8ba423dbb77fc532ecefebe114e6b77327bd9
  model: facebook/opt-125m
  servedModelName: opt-125m
  kvCacheSpace: "1"   # GiB of CPU KV cache
  enforceEager: true  # skips the torch.compile warm-up, too slow on 1 CPU
  resources:
    requests: {cpu: 1000m, memory: 4Gi}   # measured: ~1 CPU, 3.1 GiB while starting
    limits: {cpu: 1000m, memory: 6Gi}

loki:
  fullnameOverride: loki          # Alloy and Grafana depend on this name
  deploymentMode: SingleBinary    # the default is SimpleScalable with S3
  loki:
    auth_enabled: false
    commonConfig: {replication_factor: 1}
    storage: {type: filesystem}
    schemaConfig:
      configs:
        - from: "2024-04-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: loki_index_
            period: 24h
    compactor: {retention_enabled: true, delete_request_store: filesystem}
    limits_config: {retention_period: 168h}
  singleBinary: {replicas: 1, persistence: {enabled: true, size: 10Gi}}
  backend: {replicas: 0}
  read: {replicas: 0}
  write: {replicas: 0}
  gateway: {enabled: false}
  chunksCache: {enabled: false}
  resultsCache: {enabled: false}
  lokiCanary: {enabled: false}
  test: {enabled: false}

alloy:
  controller: {type: deployment, replicas: 1}
  alloy:
    configMap:
      content: |-
        discovery.kubernetes "pods" {
          role = "pod"
        }

        discovery.relabel "pods" {
          targets = discovery.kubernetes.pods.targets

          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            target_label  = "namespace"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_name"]
            target_label  = "pod"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_container_name"]
            target_label  = "container"
          }
          // Fall back to app.kubernetes.io/name (e.g. litellm pods have no `app` label);
          // the `app` label below overrides it when present and non-empty.
          rule {
            source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
            target_label  = "app"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_label_app"]
            regex         = "(.+)"
            target_label  = "app"
          }
        }

        loki.source.kubernetes "pods" {
          targets    = discovery.relabel.pods.output
          forward_to = [loki.write.default.receiver]
        }

        loki.write "default" {
          endpoint {
            url = "http://loki:3100/loki/api/v1/push"
          }
        }

yace:
  aws:
    secret:
      name: yace-aws-credentials

  # ServiceMonitor is created by the chart's own templates/servicemonitors.yaml file.
  serviceMonitor:
    enabled: false

  # YACE job config: https://github.com/prometheus-community/yet-another-cloudwatch-exporter/blob/master/docs/configuration.md
  # Metric names follow aws_<namespace>_<metric>_<statistic> in snake_case,
  # e.g. AWS/Bedrock InputTokenCount Sum → aws_bedrock_input_token_count_sum.
  config: |-
    apiVersion: v1alpha1
    # Bedrock invocation metrics are dimensioned by ModelId and have no taggable
    # resources, so they go under customNamespace instead of discovery.
    customNamespace:
      - name: bedrock
        namespace: AWS/Bedrock
        # Keep in sync with the Bedrock plugin's REGIONS (core/infra/kubernetes/catalog.yaml),
        # since the UI's per-endpoint panels filter on region.
        regions:
          - us-east-1
          - eu-central-1
        period: 300
        length: 600
        # Report 0 instead of dropping the series when a model had no traffic in
        # the last period, so per-endpoint charts show idle time rather than gaps.
        nilToZero: true
        metrics:
          - name: Invocations
            statistics: [Sum]
          - name: InvocationLatency
            statistics: [Average]
          - name: InputTokenCount
            statistics: [Sum]
          - name: OutputTokenCount
            statistics: [Sum]

  testConnection: false
  extraArgs: {scraping-interval: 300}   # this one drives AWS cost, so it is a default
