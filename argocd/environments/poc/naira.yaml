apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: naira
  namespace: argocd
  annotations:
    # Wave 5 — last. Nothing in Naira starts before its tier exists.
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: naira
  source:
    # The released chart on ghcr. Its default image registry is
    # ghcr.io/naira-project, where every image it references is published
    # (tag v0.1.1, amd64 and arm64), so nothing is side-loaded.
    repoURL: oci://ghcr.io/naira-project/charts/naira
    chart: naira
    targetRevision: 0.1.1
    helm:
      # Keys of naira chart 0.1.1 (deploy/charts/naira/values.yaml). Its
      # defaults already address the test-dependencies release in naira-deps
      # (Keycloak, LiteLLM, MLflow, MCP) and a port-forwarded browser on
      # localhost, so only the Secrets are set here.
      valuesObject:
        catalog:
          # PoC only. Every other path supplies this as an ExternalSecret.
          secret:
            create: true
            data:
              LITELLM_API_KEY: sk-local-litellm
              OPENMETADATA_ADMIN_PASSWORD: admin
          plugins:
            openmetadata:
              # tags.openmetadata is off in poc/test-dependencies.yaml.
              enabled: false
        portal:
          oidc:
            secret:
              create: true
              value: naira-local-dev-secret
  destination:
    server: https://kubernetes.default.svc
    namespace: idp-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
